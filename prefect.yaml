name: mta-reliability-tracker
prefect-version: "3.0"

deployments:
  - name: mta-s3-to-snowflake
    version: null
    tags:
      - mta
      - snowflake
      - cold-compaction
    description: "Daily S3 Parquet → Snowflake compaction"
    entrypoint: flows/mta_s3_to_snowflake.py:mta_s3_to_snowflake
    work_pool:
      name: managed-pool
      work_queue_name: default
      job_variables:
        env:
          AWS_ACCESS_KEY_ID: "{{ prefect.variables.aws_access_key_id }}"
          AWS_SECRET_ACCESS_KEY: "{{ prefect.variables.aws_secret_access_key }}"
          AWS_DEFAULT_REGION: "us-east-1"
          SNOWFLAKE_ACCOUNT: "{{ prefect.variables.snowflake_account }}"
          SNOWFLAKE_USER: "{{ prefect.variables.snowflake_user }}"
          SNOWFLAKE_PASSWORD: "{{ prefect.variables.snowflake_password }}"
          SNOWFLAKE_WAREHOUSE: "COMPUTE_WH"
          SNOWFLAKE_DATABASE: "MTA"
          SNOWFLAKE_ROLE: "MTA_TRANSFORMER"
          S3_BUCKET: "{{ prefect.variables.s3_bucket }}"
    schedule:
      cron: "0 3 * * *"
      timezone: "America/New_York"
    pull:
      - prefect.deployments.steps.git_clone:
          repository: git@github.com:your-username/MTA-subway-reliability-tracker.git
          branch: main
